# Keep build tools, test fixtures, and maintainer reports out of GitHub Pages.
exclude:
  - scripts
  - tests
  - docs
  - README.md
  - data-summary.json
  - data/source-reviews.json
  - data/name-corrections.json
  - data/category-reviews.json
  - data/public-name-reviews.json
  - private-input
  - private-output
  - private
  - node_modules
  - package.json
  - package-lock.json
